<style>
:root{--bg:#090d16;--panel:#111827;--panel2:#151f30;--line:#26364c;--muted:#8fa2bd;--text:#eef4ff;--gold:#e8c878;--cyan:#61d7d2;--red:#ff777e;--green:#7de0a1;--blue:#6f9eff;--shadow:0 16px 42px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 85% -10%,#17324b 0%,transparent 65%),var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.2px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#1a2940;color:var(--text);transition:.15s}button:hover{filter:brightness(1.15);transform:translateY(-1px)}button.primary{background:linear-gradient(135deg,#d8bb6b,#a98a43);border-color:#f1d991;color:#111827;font-weight:800}button.ghost{background:transparent}button.danger{border-color:#773c4a;color:#ffb4b8}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#0b111d;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 20px;border-bottom:1px solid var(--line)}.brandmark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e8ce83,#8b7138);color:#101722;display:grid;place-items:center;font-weight:1000;font-size:20px}.brand strong{display:block;letter-spacing:2px;font-size:15px}.brand small{color:var(--muted);font-size:11px}.navlabel{font-size:10px;color:#60738f;letter-spacing:2px;padding:0 10px;margin-bottom:6px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;color:#9eb0c8;padding:12px}.nav button.active{background:#1a2b41;border-color:#304762;color:#fff}.nav .ico{width:20px;text-align:center;font-size:17px}.sidebar-bottom{margin-top:auto;color:#657994;font-size:11px;line-height:1.6;padding:12px}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#0b111bcc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:3}.season-tag{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1px}.top-right{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#273a54;color:var(--gold);font-weight:800}.content{padding:28px 32px 50px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.page-head h1{font-size:30px;margin:6px 0 4px;letter-spacing:-1px}.sub{color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,#141f30,#101725);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}.card h3{font-size:14px;margin:0 0 14px}.metric{font-size:30px;font-weight:850;letter-spacing:-1px;margin:9px 0 4px}.metric small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.statline{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:13px 0 7px}.bar{height:6px;background:#26354a;border-radius:99px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--cyan),#a3f2d5);border-radius:99px}.bar.gold span{background:linear-gradient(90deg,#b38c43,#f4df96)}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-bottom:16px}.hero-main{background:radial-gradient(500px 300px at 100% 0%,#244a60 0%,transparent 70%),linear-gradient(135deg,#17283c,#111827);position:relative;overflow:hidden}.hero-main:after{content:'R';position:absolute;right:25px;bottom:-75px;font-size:280px;font-weight:1000;color:#ffffff07;pointer-events:none}.player-kicker{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.5px}.player-name{font-size:35px;font-weight:900;letter-spacing:-1.5px;margin:15px 0 4px}.player-meta{color:#a9bdd5;font-size:12px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.5px;background:#26394e;color:#c9e7f1;border:1px solid #36516a}.pill.gold{background:#3a3221;color:#f2d98e;border-color:#6d5a2d}.pill.green{background:#19352f;color:#a1f1c6;border-color:#2b6956}.pill.red{background:#3b222d;color:#ffb8c1;border-color:#713d4b}.hero-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}.ovr-ring{width:126px;height:126px;border-radius:50%;border:7px solid #32465b;border-top-color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:4px auto 12px;box-shadow:0 0 35px #e8c8780c}.ovr-ring strong{font-size:39px;line-height:1}.ovr-ring small{font-size:10px;letter-spacing:2px;color:var(--gold);margin-top:5px}.center{text-align:center}.schedule-item,.listrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #263246}.schedule-item:last-child,.listrow:last-child{border:0}.datebox{background:#1d2a3d;border-radius:8px;padding:8px 10px;text-align:center;min-width:48px}.datebox strong{display:block;font-size:16px}.datebox small{font-size:9px;color:var(--muted)}.grow{flex:1;min-width:0}.grow strong{display:block;font-size:12px}.grow small{color:var(--muted);font-size:11px}.result{font-size:11px;font-weight:900}.win{color:var(--green)}.loss{color:var(--red)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:11px;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:540px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #263246;text-align:left;font-size:12px;white-space:nowrap}.table th{color:#8fa3bf;background:#131d2c;font-size:10px;letter-spacing:1px}.table tr:last-child td{border-bottom:0}.table tr.me td{background:#192c40}.table td strong{font-size:12px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:11px;color:#a9bad0;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #34465e;border-radius:9px;background:#0c1420;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--cyan)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.notice{border:1px solid #66562f;background:#2a2519;border-radius:10px;padding:12px 14px;color:#e8d69b;font-size:12px;line-height:1.6}.matchbox{background:radial-gradient(400px 240px at 50% 0%,#21465b,#121b29 70%);border:1px solid #34516a;border-radius:16px;padding:26px;text-align:center}.versus{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px 0}.versus .team{font-size:18px;font-weight:900;min-width:100px}.versus .vs{color:var(--gold);font-weight:900;font-style:italic;font-size:23px}.pickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.champ{padding:13px;border:1px solid #33475f;border-radius:11px;background:#111b29;text-align:left}.champ.selected{border-color:var(--gold);background:#302a1c;box-shadow:inset 0 0 0 1px #8b7138}.champ strong{display:block;font-size:12px}.champ small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.champ .mastery{color:var(--cyan);font-size:10px;margin-top:8px}.feed{display:grid;gap:10px}.feeditem{display:flex;gap:12px;padding:13px;background:#121c2a;border-radius:10px;border:1px solid #26374c}.feedicon{width:32px;height:32px;border-radius:9px;background:#26374c;display:grid;place-items:center;flex-shrink:0}.feeditem strong{font-size:12px;display:block;margin-bottom:4px}.feeditem p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}.empty{padding:34px;text-align:center;color:var(--muted)}.footer-note{margin-top:20px;color:#5e718b;font-size:10px;line-height:1.6}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid #43645f;background:#142a2b;border-radius:10px;color:#d4fff0;z-index:9;box-shadow:var(--shadow);font-size:12px;display:none}.toast.show{display:block}.mobilemenu{display:none}
@media(max-width:1000px){.app{grid-template-columns:205px 1fr}.content{padding:22px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ovr-ring{width:100px;height:100px}.metric{font-size:26px}}@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:5;left:-250px;top:0;bottom:0;width:240px;transition:left .2s}.sidebar.open{left:0}.mobilemenu{display:inline-block}.topbar{padding:0 15px;height:62px}.content{padding:20px 14px 40px}.page-head{align-items:flex-start}.page-head h1{font-size:25px}.g4,.g3,.g2{grid-template-columns:1fr}.hero-side{grid-template-columns:1fr 1fr}.player-name{font-size:29px}.pickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.top-right .hide-sm{display:none}.card{padding:16px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">R</div><div><strong>RIFT CAREER</strong><small>PRO PLAYER SIMULATOR</small></div></div><div><div class="navlabel">CAREER OFFICE</div><nav class="nav" id="nav"><button data-page="home" class="active"><span class="ico">◈</span>커리어 홈</button><button data-page="clubhouse"><span class="ico">⌂</span>클럽하우스</button><button data-page="playball"><span class="ico">⚔</span>경기 / 드래프트</button><button data-page="training"><span class="ico">↗</span>훈련 센터</button><button data-page="market"><span class="ico">⇄</span>이적 시장</button><button data-page="league"><span class="ico">▤</span>리그 / 순위</button><button data-page="records"><span class="ico">✧</span>커리어 기록</button></nav></div><div><div class="navlabel">SYSTEM</div><nav class="nav"><button data-page="save"><span class="ico">▣</span>저장 / 설정</button><button data-page="newcareer"><span class="ico">＋</span>새 커리어</button></nav></div><div class="sidebar-bottom">RIFT CAREER · BUILD 0.1<br>싱글 플레이 / 로컬 저장<br>가상의 선수 커리어 시뮬레이션</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" id="mobilemenu">☰</button><span class="season-tag" id="seasonLabel">2026 SPRING · WEEK 01</span></div><div class="top-right"><span class="hide-sm" id="teamLabel">팀 미배정</span><span>◆ <b id="moneyLabel">₩0</b></span><div class="avatar" id="topAvatar">?</div></div></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const ROLES=['탑','정글','미드','원딜','서포터'];
const CHAMPS={탑:[['제이스','포킹 / 라인전'],['레넥톤','강한 초반'],['크산테','탱킹 / 한타'],['럼블','광역 피해'],['잭스','사이드 운영'],['그웬','성장형 딜러']],정글:[['리 신','초반 개입'],['바이','확정 이니시'],['오공','한타 개시'],['세주아니','탱킹 / 연계'],['신 짜오','교전 강점'],['비에고','교전 초기화']],미드:[['아리','기동성 / 픽'],['오리아나','한타 / 유틸'],['아지르','후반 캐리'],['신드라','폭딜 / 라인전'],['요네','교전 / 사이드'],['탈리야','로밍 / 합류']],원딜:[['징크스','후반 캐리'],['바루스','포킹 / 라인전'],['카이사','진입 / 암살'],['이즈리얼','포킹 / 생존'],['애쉬','시야 / 이니시'],['자야','생존 / 한타']],서포터:[['노틸러스','이니시 / 픽'],['라칸','기동성 / 한타'],['레오나','강한 이니시'],['룰루','보호 / 성장'],['알리스타','진형 붕괴'],['바드','로밍 / 변수']]};
const TEAMS=[['GEN','젠지','LCK',83],['T1','T1','LCK',82],['HLE','한화생명e스포츠','LCK',81],['DK','Dplus KIA','LCK',78],['KT','KT 롤스터','LCK',77],['KDF','DN 수퍼스','LCK',74],['BRO','한진 브리온','LCK',70],['NS','농심 레드포스','LCK',72],['DRX','DRX','LCK',71],['BFX','BNK 피어엑스','LCK',73],['CLGEN','젠지 글로벌 아카데미','LCK CL',68],['CLT1','T1 이스포츠 아카데미','LCK CL',67],['CLDK','Dplus KIA 챌린저스','LCK CL',66],['CLBRO','한진 브리온 챌린저스','LCK CL',63]];
const STRATS=[['balanced','밸런스 운영','기본형. 모든 상황에서 안정적'],['early','초반 주도권','초반 교전과 라인전 능력에 가중치'],['objective','오브젝트 중심','드래곤·전령 교전과 운영에 강점'],['scale','후반 성장','경기 시간이 길어질수록 유리'],['protect','캐리 보호','팀의 핵심 딜러를 보조하는 운영']];
const fresh=()=>({version:1,created:false,name:'',age:17,nation:'대한민국',role:'미드',style:'플레이메이커',team:'CLGEN',stage:'아카데미 유망주',ovr:54,potential:86,stats:{mechanics:56,gameSense:49,teamwork:50,discipline:52,mental:54},money:18000000,week:1,split:1,year:2026,season:'SPRING',wins:0,losses:0,careerWins:0,careerLosses:0,champions:{},selectedChampion:'아리',strategy:'balanced',fatigue:15,morale:62,contract:2,history:[],news:[{icon:'✦',title:'커리어를 시작할 준비가 됐습니다',text:'아카데미에서 실력을 증명하고 1군 무대를 향해 나아가세요.'}],achievements:[],offers:[],lastResult:null,retired:false});
let S=load();function load(){try{let v=JSON.parse(localStorage.getItem('riftCareerSave'));return v&&v.version===1?v:fresh()}catch(e){return fresh()}}function save(){localStorage.setItem('riftCareerSave',JSON.stringify(S));syncTop()}function team(id){return TEAMS.find(t=>t[0]===id)||TEAMS[10]}function addNews(icon,title,text){S.news.unshift({icon,title,text,week:S.week,year:S.year});S.news=S.news.slice(0,18)}function fmt(n){return new Intl.NumberFormat('ko-KR').format(Math.round(n))}function won(n){return '₩'+fmt(n)}function avgStats(){let vals=Object.values(S.stats);return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)}function calcOvr(){S.ovr=Math.round(avgStats()*.72+Math.min(100,S.potential)*.12+S.morale*.08+(100-S.fatigue)*.08)}function champList(){return CHAMPS[S.role]||CHAMPS['미드']}function mastery(name){return S.champions[name]||0}function syncTop(){if(!S.created)return;$('#seasonLabel').textContent=`${S.year} ${S.season} · WEEK ${String(S.week).padStart(2,'0')}`;$('#teamLabel').textContent=team(S.team)[1];$('#moneyLabel').textContent=won(S.money);$('#topAvatar').textContent=S.name?S.name.slice(0,1):'?'}function notify(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function go(page){$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');if(!S.created&&page!=='newcareer'&&page!=='save'){page='newcareer'}render(page)}function head(k,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}function card(title,body,extra=''){return `<section class="card ${extra}"><h3>${title}</h3>${body}</section>`}function statbar(label,val,color=''){return `<div class="statline"><span>${label}</span><b>${Math.round(val)}</b></div><div class="bar ${color}"><span style="width:${Math.max(0,Math.min(100,val))}%"></span></div>`}function schedule(){let opp=TEAMS[(S.week*3+2)%10];return [{day:'월',name:'팀 스크림',desc:'팀 합 맞추기 / 피드백',kind:'훈련'},{day:'수',name:'정규 리그 매치',desc:`${team(S.team)[1]} vs ${opp[1]}`,kind:'경기'},{day:'금',name:'개인 훈련',desc:'챔피언 숙련도와 기본기 향상',kind:'훈련'}]}
function home(){let t=team(S.team),total=S.wins+S.losses,wr=total?Math.round(S.wins/total*100):0;let recent=S.history.slice(0,4);return head('CAREER OVERVIEW','커리어 홈',`${S.year} 시즌의 여정이 진행 중입니다. 오늘의 선택이 다음 기회를 만듭니다.`)+`<div class="hero"><section class="card hero-main"><div class="player-kicker">✦ ${S.stage.toUpperCase()} <span class="pill gold">${S.role}</span></div><div class="player-name">${esc(S.name)}</div><div class="player-meta">${S.age}세 · ${S.nation} · ${t[1]} · ${S.style}</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:15px"><span class="pill">계약 ${S.contract}시즌 남음</span><span class="pill green">잠재력 ${S.potential}</span><span class="pill">${S.season} 시즌</span></div><div class="hero-actions"><button class="primary" onclick="R.go('playball')">다음 경기 준비 →</button><button onclick="R.go('training')">훈련 계획</button><button class="ghost" onclick="R.go('clubhouse')">선수 프로필</button></div></section><section class="card hero-side center"><div><div class="tiny" style="letter-spacing:2px">PLAYER RATING</div><div class="ovr-ring"><strong>${S.ovr}</strong><small>OVERALL</small></div><div class="tiny">리그 평균 대비 ${S.ovr>=team(S.team)[3]?'경쟁력 있음':'성장 필요'}</div></div><div style="align-self:center;text-align:left">${statbar('컨디션',100-S.fatigue,'gold')}${statbar('멘탈',S.morale)}${statbar('성장 잠재력',S.potential,'gold')}</div></section></div><div class="grid g4">${[['시즌 승리',S.wins,'W'],['시즌 패배',S.losses,'L'],['승률',wr,'%'],['주급',won(S.money/26),'/ week']].map(x=>`<section class="card"><div class="tiny">${x[0]}</div><div class="metric">${x[1]} <small>${x[2]}</small></div><div class="tiny">${x[0]==='승률'?'이번 시즌 성적':'현재 시즌 기준'}</div></section>`).join('')}</div><div class="grid g2" style="margin-top:16px"><section class="card"><div class="section-title" style="margin-top:0"><h2>이번 주 일정</h2><span>WEEK ${S.week}</span></div>${schedule().map((x,i)=>`<div class="schedule-item"><div class="datebox"><strong>${x.day}</strong><small>${['MON','WED','FRI'][i]}</small></div><div class="grow"><strong>${x.name}</strong><small>${x.desc}</small></div><span class="pill ${x.kind==='경기'?'gold':''}">${x.kind}</span></div>`).join('')}<button style="margin-top:14px;width:100%" onclick="R.advanceWeek()">일주일 진행하기 →</button></section><section class="card"><div class="section-title" style="margin-top:0"><h2>최근 소식</h2><span>CAREER FEED</span></div><div class="feed">${S.news.slice(0,4).map(n=>`<div class="feeditem"><div class="feedicon">${n.icon}</div><div><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p></div></div>`).join('')}</div></section></div><div class="footer-note">이 버전은 커리어 시뮬레이션의 첫 플레이어블 프로토타입입니다. 팀·선수 데이터와 경기 결과는 게임 진행을 위한 시뮬레이션 값이며 실제 리그의 공식 로스터나 결과를 뜻하지 않습니다.</div>`}
function clubhouse(){return head('PLAYER DEVELOPMENT','클럽하우스', '선수 정보를 확인하고, 강점과 약점을 관리하세요.')+`<div class="grid g3"><section class="card"><div class="center"><div class="ovr-ring"><strong>${S.ovr}</strong><small>OVERALL</small></div><h2 style="margin:8px 0 4px">${esc(S.name)}</h2><div class="muted" style="font-size:12px">${team(S.team)[1]} · ${S.role}</div><div style="margin-top:13px"><span class="pill gold">${S.stage}</span></div></div><div style="margin-top:22px">${statbar('기계적 숙련도',S.stats.mechanics)}${statbar('게임 이해도',S.stats.gameSense)}${statbar('팀워크',S.stats.teamwork)}${statbar('훈련 태도',S.stats.discipline)}${statbar('멘탈',S.stats.mental)}</div></section><section class="card" style="grid-column:span 2"><h3>선수 리포트</h3><div class="grid g2"><div><div class="tiny">PROFILE</div><div class="listrow"><span class="muted">나이</span><b style="margin-left:auto">${S.age}세</b></div><div class="listrow"><span class="muted">국적</span><b style="margin-left:auto">${esc(S.nation)}</b></div><div class="listrow"><span class="muted">플레이 스타일</span><b style="margin-left:auto">${S.style}</b></div><div class="listrow"><span class="muted">계약</span><b style="margin-left:auto">${S.contract}시즌</b></div></div><div><div class="tiny">SCOUTING</div><div class="listrow"><span class="muted">잠재력</span><b style="margin-left:auto;color:var(--gold)">${S.potential}/100</b></div><div class="listrow"><span class="muted">시즌 승패</span><b style="margin-left:auto">${S.wins}승 ${S.losses}패</b></div><div class="listrow"><span class="muted">통산 승패</span><b style="margin-left:auto">${S.careerWins}승 ${S.careerLosses}패</b></div><div class="listrow"><span class="muted">보유 자금</span><b style="margin-left:auto">${won(S.money)}</b></div></div></div><div class="notice" style="margin-top:20px">코치 코멘트: ${S.stats.mechanics>S.stats.gameSense?'개인 기량이 강점입니다. 경기 판단과 팀 콜을 보완하면 더 높은 무대에 도전할 수 있습니다.':'게임 이해도와 팀워크를 바탕으로 성장 중입니다. 꾸준한 챔피언 연습으로 교전 영향력을 높이세요.'}</div></section></div><div class="section-title"><h2>챔피언 숙련도</h2><span>플레이한 챔피언이 성장합니다</span></div><div class="grid g3">${Object.entries(S.champions).sort((a,b)=>b[1]-a[1]).slice(0,9).map(([name,val])=>card(name,`<div class="metric">${val}<small> / 100</small></div>${statbar('숙련도',val)}`)).join('')||card('아직 기록이 없습니다','경기에 출전하면 챔피언 숙련도가 쌓입니다.')}${card('선수 성장 가이드','<p class="muted" style="font-size:12px;line-height:1.7">훈련은 능력치를 직접 올리고, 경기는 숙련도·평판·계약 기회에 영향을 줍니다. 컨디션이 낮으면 경기력이 떨어지므로 휴식도 중요합니다.</p>')}</div>`}
function playball(){let opp=TEAMS[(S.week*3+2)%10];let champs=champList();if(!champs.some(c=>c[0]===S.selectedChampion))S.selectedChampion=champs[0][0];return head('MATCH DAY','경기 / 드래프트', '챔피언과 팀 전략을 선택한 뒤 경기를 시뮬레이션하세요.',`<span class="pill gold">${S.season} · WEEK ${S.week}</span>`)+`<div class="matchbox"><div class="eyebrow">UPCOMING MATCH</div><div class="versus"><div class="team">${team(S.team)[1]}</div><div class="vs">VS</div><div class="team">${opp[1]}</div></div><div class="muted" style="font-size:12px">${opp[2]} · 정규 시즌 매치 · 시뮬레이션</div></div><div class="section-title"><h2>1. 챔피언 선택</h2><span>${S.role} 포지션 추천 풀</span></div><div class="pickgrid">${champs.map(c=>`<button class="champ ${S.selectedChampion===c[0]?'selected':''}" onclick="R.pick('${c[0]}')"><strong>${c[0]}</strong><small>${c[1]}</small><div class="mastery">숙련도 ${mastery(c[0])}</div></button>`).join('')}</div><div class="section-title"><h2>2. 팀 전략</h2><span>전략은 경기 흐름에 영향을 줍니다</span></div><div class="grid g3">${STRATS.map(s=>`<button class="champ ${S.strategy===s[0]?'selected':''}" onclick="R.strategy('${s[0]}')"><strong>${s[1]}</strong><small>${s[2]}</small></button>`).join('')}</div><div class="grid g2" style="margin-top:16px"><section class="card"><h3>출전 전 상태</h3>${statbar('컨디션',100-S.fatigue,'gold')}${statbar('멘탈',S.morale)}${statbar('선택 챔피언 숙련도',mastery(S.selectedChampion))}<div class="tiny" style="margin-top:12px">숙련도가 낮은 챔피언도 선택할 수 있지만 경기력에 불리할 수 있습니다.</div></section><section class="card"><h3>코치의 경기 계획</h3><p class="muted" style="font-size:12px;line-height:1.8">${STRATS.find(s=>s[0]===S.strategy)[2]}. ${S.fatigue>65?'피로가 누적되어 있습니다. 휴식을 고려하세요.':'컨디션은 경기 출전에 무리가 없는 수준입니다.'}</p><button class="primary" style="width:100%;margin-top:8px" onclick="R.playMatch()">경기 진행하기</button></section></div>${S.lastResult?`<div class="section-title"><h2>직전 경기 결과</h2><span>LAST MATCH</span></div><section class="card"><div class="metric ${S.lastResult.win?'win':'loss'}">${S.lastResult.win?'VICTORY':'DEFEAT'} <small>${S.lastResult.score}</small></div><p class="muted" style="font-size:12px;line-height:1.8">${esc(S.lastResult.text)}</p></section>`:''}`}
function training(){let opts=[['mechanics','개인 피지컬 훈련','기계적 숙련도 +2~5 · 피로 증가'],['gameSense','리플레이 분석','게임 이해도 +2~5 · 피로 소폭 증가'],['teamwork','팀 스크림','팀워크 +2~5 · 멘탈 회복'],['discipline','루틴 훈련','훈련 태도 +2~5 · 컨디션 관리'],['mental','멘탈 케어','멘탈 +4~7 · 피로 감소'],['rest','휴식 / 회복','피로 감소 · 멘탈 회복']];return head('TRAINING ROOM','훈련 센터','훈련은 성장의 핵심입니다. 같은 훈련을 반복하면 효율이 조금씩 낮아집니다.')+`<div class="grid g3">${opts.map(o=>`<section class="card"><div class="eyebrow">DEVELOPMENT</div><h3 style="font-size:16px;margin-top:10px">${o[1]}</h3><p class="muted" style="font-size:12px;line-height:1.7;min-height:42px">${o[2]}</p><button class="${o[0]==='rest'?'':'primary'}" style="width:100%" onclick="R.train('${o[0]}')">훈련 시작</button></section>`).join('')}</div><div class="section-title"><h2>현재 능력치</h2><span>OVR ${S.ovr}</span></div><section class="card"><div class="grid g2">${Object.entries(S.stats).map(([k,v])=>statbar(({mechanics:'기계적 숙련도',gameSense:'게임 이해도',teamwork:'팀워크',discipline:'훈련 태도',mental:'멘탈'})[k],v)).join('')}</div><div class="notice" style="margin-top:20px">훈련을 여러 번 진행한 뒤 경기나 주간 진행으로 시즌을 운영하세요. 나이가 오를수록 성장 속도는 느려집니다.</div></section>`}
function market(){let offer=S.offers.find(o=>!o.used);return head('TRANSFER WINDOW','이적 시장','경기력과 평판을 쌓으면 상위 팀의 관심을 받을 수 있습니다.')+`<div class="grid g2"><section class="card"><div class="eyebrow">CURRENT CONTRACT</div><h2 style="margin:10px 0">${team(S.team)[1]}</h2><div class="metric">${won(S.money/26)}<small> / 주급 환산</small></div><div class="listrow"><span class="muted">남은 계약</span><b style="margin-left:auto">${S.contract} 시즌</b></div><div class="listrow"><span class="muted">현재 단계</span><b style="margin-left:auto">${S.stage}</b></div><div class="listrow"><span class="muted">평균 OVR</span><b style="margin-left:auto">${S.ovr}</b></div><button onclick="R.seekOffers()" class="primary" style="width:100%;margin-top:14px">스카우트 관심 확인</button></section><section class="card"><div class="eyebrow">TRANSFER DESK</div><h3 style="margin-top:10px">영입 제안</h3>${offer?`<div class="feeditem"><div class="feedicon">⇄</div><div><strong>${team(offer.team)[1]}의 제안</strong><p>${offer.text}</p><p style="margin-top:8px;color:var(--gold)">예상 주급 ${won(offer.salary/26)}</p></div></div><div class="hero-actions"><button class="primary" onclick="R.acceptOffer()">제안 수락</button><button onclick="R.rejectOffer()">거절</button></div>`:`<div class="empty">현재 유효한 제안이 없습니다.<br><span class="tiny">스카우트 관심 확인으로 이적 가능성을 살펴보세요.</span></div>`}</section></div><div class="section-title"><h2>이적 참고</h2><span>SIMULATION RULES</span></div><section class="card"><p class="muted" style="font-size:12px;line-height:1.9">상위 팀은 선수의 OVR, 잠재력, 포지션, 시즌 성적을 종합해 관심을 보입니다. 제안을 수락하면 팀과 계약 조건이 변경됩니다. 계약 만료 시점과 시즌 진행에 따라 새로운 선택지가 열릴 수 있습니다. 실제 구단의 공식 영입 의사나 실제 계약을 반영한 기능은 아닙니다.</p></section>`}
function league(){let rows=TEAMS.slice(0,10).map((t,i)=>({t,pts:Math.max(0,30-i*2+((t[0]===S.team)?S.wins-S.losses:Math.floor(Math.sin(i*3+S.week)*5))),w:Math.max(0,15-i+((t[0]===S.team)?S.wins:0)),l:Math.max(0,5+i+((t[0]===S.team)?S.losses:0))})).sort((a,b)=>b.pts-a.pts);return head('LEAGUE CENTER','리그 / 순위','시즌 진행에 따라 선수와 팀의 성적을 확인하세요.')+`<div class="grid g4">${[['리그','LCK'],['시즌',`${S.year} ${S.season}`],['현재 주차',`WEEK ${S.week}`],['내 팀',team(S.team)[1]]].map(x=>`<section class="card"><div class="tiny">${x[0]}</div><div style="font-weight:800;font-size:17px;margin-top:10px">${x[1]}</div></section>`).join('')}</div><div class="section-title"><h2>LCK 순위표</h2><span>시뮬레이션 순위 · 승점은 게임 내 산정값</span></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>팀</th><th>리그</th><th>승</th><th>패</th><th>승점</th><th>전력</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.t[0]===S.team?'me':''}"><td>${i+1}</td><td><strong>${r.t[1]}</strong>${r.t[0]===S.team?' <span class="pill gold">MY TEAM</span>':''}</td><td>${r.t[2]}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pts}</td><td>${r.t[3]}</td></tr>`).join('')}</tbody></table></div><div class="section-title"><h2>아카데미 / LCK CL</h2><span>성장 단계의 출발점</span></div><div class="grid g3">${TEAMS.slice(10).map(t=>card(t[1],`<div class="listrow"><span class="muted">팀 전력</span><b style="margin-left:auto">${t[3]}</b></div><div class="tiny">${t[2]} · 유망주 육성</div>`)).join('')}</div>`}
function records(){return head('HALL OF CAREER','커리어 기록','선수 생활 동안의 성적과 주요 이벤트를 되돌아보세요.')+`<div class="grid g4">${[['통산 승리',S.careerWins],['통산 패배',S.careerLosses],['출전 경기',S.careerWins+S.careerLosses],['획득 업적',S.achievements.length]].map(x=>`<section class="card"><div class="tiny">${x[0]}</div><div class="metric">${x[1]}</div></section>`).join('')}</div><div class="section-title"><h2>주요 커리어 이벤트</h2><span>최근 기록 순</span></div><section class="card">${S.history.length?S.history.slice(0,30).map(h=>`<div class="listrow"><div class="datebox"><strong>${h.year}</strong><small>W${h.week}</small></div><div class="grow"><strong>${esc(h.title)}</strong><small>${esc(h.text)}</small></div><span class="pill ${h.type==='win'?'green':h.type==='loss'?'red':'gold'}">${h.tag}</span></div>`).join(''):'<div class="empty">아직 기록된 커리어 이벤트가 없습니다. 첫 경기를 진행해 보세요.</div>'}</section><div class="section-title"><h2>업적</h2></div><div class="grid g3">${[['첫 승','첫 공식 경기 승리','첫 승리 기록을 달성하면 해금',S.careerWins>=1],['두 자릿수 승리','통산 10승','꾸준한 경기력의 증명',S.careerWins>=10],['1군 도전','1군 후보군 진입','아카데미를 넘어 다음 단계로',S.stage!=='아카데미 유망주'],['챔피언 장인','숙련도 70 달성','한 챔피언의 숙련도를 70까지 성장',Object.values(S.champions).some(v=>v>=70)],['멘탈 관리','멘탈 80 달성','압박 속에서도 평정심 유지',S.morale>=80],['베테랑','만 23세 도달','긴 커리어를 이어가기',S.age>=23]].map(a=>card(`<span style="color:${a[3]?'var(--gold)':'var(--muted)'}">${a[3]?'✦':'◇'}</span> ${a[0]}`,`<p class="muted" style="font-size:12px">${a[1]}</p><div class="tiny">${a[2]}</div>`,'' )).join('')}</div>`}
function savePage(){return head('SAVE MANAGEMENT','저장 / 설정','진행 상황은 이 브라우저에 자동 저장됩니다. 다른 기기에서 이어 하려면 백업 파일을 사용하세요.')+`<div class="grid g2"><section class="card"><h3>세이브 데이터</h3><p class="muted" style="font-size:12px;line-height:1.8">게임 진행 상황은 브라우저의 로컬 저장소에 기록됩니다. 브라우저 데이터 삭제 시 저장이 사라질 수 있으니 정기적으로 내보내기 하세요.</p><div class="hero-actions"><button class="primary" onclick="R.exportSave()">세이브 내보내기 (.json)</button><label for="importFile" style="display:inline-flex;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#1a2940;font-size:13px">세이브 불러오기</label><input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="R.importSave(this.files[0])"></div><div class="listrow" style="margin-top:16px"><span class="muted">자동 저장</span><b style="margin-left:auto;color:var(--green)">활성화</b></div><div class="listrow"><span class="muted">세이브 버전</span><b style="margin-left:auto">0.1</b></div></section><section class="card"><h3>게임 정보</h3><div class="listrow"><span class="muted">프로젝트</span><b style="margin-left:auto">RIFT CAREER</b></div><div class="listrow"><span class="muted">플레이 방식</span><b style="margin-left:auto">싱글 플레이</b></div><div class="listrow"><span class="muted">필요한 서버</span><b style="margin-left:auto">없음</b></div><div class="listrow"><span class="muted">호스팅</span><b style="margin-left:auto">GitHub Pages</b></div><div class="notice" style="margin-top:15px">첫 버전은 저장·경기·훈련·이적을 연결한 기반 시스템입니다. 실제 온라인 계정, 멀티플레이, 공식 API 연동은 포함되어 있지 않습니다.</div></section></div><section class="card" style="margin-top:16px"><h3>주의 사항</h3><p class="muted" style="font-size:12px;line-height:1.8">새 커리어를 만들면 현재 브라우저 저장 데이터가 교체됩니다. 기존 진행 상황을 남기고 싶다면 먼저 세이브를 내보내세요.</p><button class="danger" onclick="R.resetSave()">저장 데이터 초기화</button></section>`}
function newcareer(){return head('NEW PLAYER CONTRACT','새 커리어','선수로서의 첫 계약을 시작하세요. 이름과 포지션을 정하면 커리어가 시작됩니다.')+`<div class="grid g2"><section class="card"><div class="eyebrow">PLAYER REGISTRATION</div><h2 style="margin:10px 0 20px">선수 등록</h2><form id="careerForm"><div class="field"><label>선수 이름 / 닉네임</label><input name="name" maxlength="18" required placeholder="예: RIFT" value="${S.created?esc(S.name):''}"></div><div class="formgrid"><div class="field"><label>주 포지션</label><select name="role">${ROLES.map(r=>`<option ${S.created&&S.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>플레이 스타일</label><select name="style">${['플레이메이커','라인전 압박','팀파이트 중심','성장형 캐리','유틸리티 / 서포트'].map(r=>`<option ${S.created&&S.style===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>국적</label><select name="nation"><option>대한민국</option><option>중국</option><option>베트남</option><option>유럽</option><option>북미</option><option>기타</option></select></div><div class="field"><label>시작 팀</label><select name="team">${TEAMS.slice(10).map(t=>`<option value="${t[0]}" ${S.created&&S.team===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div></div><div class="notice">시작 선수는 17세 아카데미 유망주입니다. 높은 잠재력과 성장 기회를 가지고 있지만, 1군 주전이 되려면 경기와 훈련으로 실력을 증명해야 합니다.</div><button class="primary" style="width:100%;margin-top:18px" type="button" onclick="R.signContract()">${S.created?'새 선수로 다시 시작':'선수 계약 체결'} →</button></form></section><section class="card"><div class="eyebrow">YOUR JOURNEY</div><h2 style="margin:10px 0 20px">커리어 진행 경로</h2>${[['01','아카데미 유망주','기본기를 쌓고 챔피언 숙련도를 올리세요.'],['02','LCK CL 핵심 선수','꾸준한 경기력으로 팀 내 입지를 확보하세요.'],['03','1군 콜업 후보','상위 리그의 스카우트 관심과 계약 제안을 노리세요.'],['04','LCK 주전 도전','압박을 이겨내고 최고의 무대에서 활약하세요.'],['05','베테랑 / 은퇴','기록을 쌓고 선수 생활의 다음 장을 결정하세요.']].map(a=>`<div class="listrow"><div class="datebox"><strong>${a[0]}</strong></div><div class="grow"><strong>${a[1]}</strong><small>${a[2]}</small></div></div>`).join('')}<p class="footer-note">선택과 경기 결과에 따라 성장 속도와 이적 기회가 달라집니다. 모든 결과는 게임 내 시뮬레이션입니다.</p></section></div>`}
function render(page='home'){if(!S.created&&page!=='newcareer')page='newcareer';let html=({home,clubhouse,playball,training,market,league,records,save:savePage,newcareer})[page]();$('#content').innerHTML=html;syncTop();if(page==='newcareer')$('#careerForm')?.addEventListener('submit',e=>{e.preventDefault();signContract();});
function signContract(){const form=$('#careerForm');if(!form){notify('선수 등록 화면을 다시 열어 주세요.');return;}try{const name=String(form.querySelector('[name="name"]')?.value||'').trim();if(!name){notify('선수 이름 또는 닉네임을 입력해 주세요.');form.querySelector('[name="name"]')?.focus();return;}const role=String(form.querySelector('[name="role"]')?.value||'미드');const style=String(form.querySelector('[name="style"]')?.value||'플레이메이커');const nation=String(form.querySelector('[name="nation"]')?.value||'대한민국');const teamId=String(form.querySelector('[name="team"]')?.value||'CLGEN');if(!TEAMS.some(t=>t[0]===teamId)){notify('시작 팀을 다시 선택해 주세요.');return;}S=fresh();S.created=true;S.name=name;S.role=role;S.style=style;S.nation=nation;S.team=teamId;S.selectedChampion=(CHAMPS[role]||CHAMPS['미드'])[0][0];S.news=[{icon:'✦',title:'프로 커리어가 시작됐습니다',text:`${name} 선수, ${team(teamId)[1]}에서 첫 시즌을 시작합니다.`}];addNews('♟','첫 계약 체결',`${name} 선수가 ${team(teamId)[1]} 소속으로 등록되었습니다.`);calcOvr();save();render('home');go('home');notify('선수 계약 체결 완료! 커리어가 시작됐습니다.');}catch(err){console.error('RIFT CAREER contract error:',err);notify('계약 처리 중 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.');}}}
function pick(name){S.selectedChampion=name;save();render('playball')}function strategy(id){S.strategy=id;save();render('playball')}
function playMatch(){if(S.retired){notify('은퇴한 선수는 경기에 출전할 수 없습니다.');return}let opp=TEAMS[(S.week*3+2)%10],ch=S.selectedChampion;let champBonus=Math.min(8,mastery(ch)/12),stratBonus={balanced:0,early:(S.stats.mechanics-50)/12,objective:(S.stats.gameSense-50)/12,scale:(S.ovr-55)/10,protect:(S.stats.teamwork-50)/10}[S.strategy];let fatiguePenalty=S.fatigue*.075;let teamDelta=(team(S.team)[3]-opp[3])*.34;let random=(Math.random()*18)-9;let score=S.ovr*.44+S.stats.gameSense*.14+S.stats.teamwork*.12+champBonus+stratBonus-fatiguePenalty+teamDelta+random;let win=score>=42;let delta=win?1:-1;S.wins+=win?1:0;S.losses+=win?0:1;S.careerWins+=win?1:0;S.careerLosses+=win?0:1;S.champions[ch]=Math.min(100,mastery(ch)+(win?4:2));S.fatigue=Math.min(100,S.fatigue+(win?14:18));S.morale=Math.max(5,Math.min(100,S.morale+(win?5:-7)));S.money+=win?3500000:1800000;let text=win?`${ch} 숙련도와 팀 운영이 좋은 결과로 이어졌습니다. 경기 후 코치 평가가 상승했습니다.`:`아쉬운 패배입니다. ${ch} 숙련도는 성장했지만, 리플레이 분석으로 약점을 보완할 필요가 있습니다.`;S.lastResult={win,score:win?'2 : 0':'0 : 2',text,champion:ch,opponent:opp[1]};S.history.unshift({year:S.year,week:S.week,title:`${win?'승리':'패배'} · ${opp[1]}전`,text:`${ch} 선택 / ${S.strategy} 전략 / ${text}`,type:win?'win':'loss',tag:win?'VICTORY':'DEFEAT'});addNews(win?'🏆':'⚔',`${win?'경기 승리':'경기 패배'} · ${opp[1]}`,text);if(S.careerWins>=1&&!S.achievements.includes('첫 승'))S.achievements.push('첫 승');if(S.ovr>=65&&S.stage==='아카데미 유망주'){S.stage='LCK CL 핵심 선수';addNews('↗','성장 단계 상승','꾸준한 훈련과 경기력을 인정받아 LCK CL 핵심 선수로 분류되었습니다.')}if(S.ovr>=73&&S.stage==='LCK CL 핵심 선수'){S.stage='1군 콜업 후보';addNews('✦','1군 콜업 후보','상위 무대 진입 가능성이 생겼습니다. 이적 시장에서 관심을 확인하세요.')}calcOvr();save();render('playball');notify(win?'승리! 경기 보상과 숙련도를 획득했습니다.':'패배. 다음 경기를 위해 약점을 보완하세요.');}
function train(kind){let before=S.stats[kind]||0;if(kind==='rest'){S.fatigue=Math.max(0,S.fatigue-28);S.morale=Math.min(100,S.morale+5);addNews('☾','휴식 및 회복','피로가 감소하고 멘탈이 회복되었습니다.')}else{let amount=kind==='mental'?5+Math.floor(Math.random()*3):2+Math.floor(Math.random()*4);S.stats[kind]=Math.min(100,S.stats[kind]+amount);S.fatigue=Math.min(100,S.fatigue+(kind==='mental'?2:10));if(kind==='teamwork')S.morale=Math.min(100,S.morale+4);if(kind==='mental'){S.fatigue=Math.max(0,S.fatigue-8);S.morale=Math.min(100,S.morale+amount)}addNews('↗','훈련 완료',`${({mechanics:'개인 피지컬 훈련',gameSense:'리플레이 분석',teamwork:'팀 스크림',discipline:'루틴 훈련',mental:'멘탈 케어'})[kind]}으로 능력치가 성장했습니다.`)}S.morale=Math.max(0,Math.min(100,S.morale));calcOvr();save();render('training');notify('훈련 결과가 반영되었습니다.');}
function advanceWeek(){S.week++;S.fatigue=Math.max(0,S.fatigue-12);S.money+=Math.round(S.money/26);if(S.week>12){S.week=1;S.split++;S.season=S.season==='SPRING'?'SUMMER':'SPRING';if(S.season==='SPRING')S.year++;S.age++;S.wins=0;S.losses=0;S.contract=Math.max(0,S.contract-1);addNews('▤','시즌 종료 및 새 스플릿',`${S.year} ${S.season} 시즌이 시작됩니다. 계약 기간을 확인하세요.`);if(S.contract===0){S.contract=1;addNews('✎','계약 재검토','계약 기간이 만료되어 구단과의 관계를 재검토합니다. 이적 시장을 확인하세요.')}if(S.age>=29){addNews('⌛','은퇴 고민','베테랑 단계에 접어들었습니다. 커리어 기록에서 지금까지의 여정을 확인하세요.')}}S.morale=Math.min(100,S.morale+2);calcOvr();save();render('home');notify('일주일이 진행되었습니다. 컨디션이 회복됐습니다.');}
function seekOffers(){if(S.offers.some(o=>!o.used)){notify('이미 확인하지 않은 제안이 있습니다.');render('market');return}let possible=TEAMS.filter(t=>t[0]!==S.team&&t[2]===(S.ovr>=73?'LCK':'LCK CL'));let eligible=S.ovr>=61||S.careerWins>=3;if(!eligible){addNews('…','스카우트 리포트','아직 구단들이 확신을 갖기엔 표본이 부족합니다. 경기와 훈련으로 평판을 높이세요.');save();render('market');notify('아직 공식 제안이 없습니다. 더 성장해 보세요.');return}let t=possible[Math.floor(Math.random()*possible.length)]||TEAMS[10];let salary=Math.round((S.money/26)*(1.4+Math.random())+S.ovr*17000);S.offers.push({team:t[0],salary,text:`${t[1]}이(가) ${S.role} 포지션의 선수로 관심을 보이고 있습니다.`,used:false});addNews('⇄','이적 시장에 관심 발생',`${t[1]}에서 영입 가능성을 문의했습니다.`);save();render('market');notify('새로운 영입 제안이 도착했습니다.')}function acceptOffer(){let o=S.offers.find(o=>!o.used);if(!o)return;S.team=o.team;S.money=Math.max(S.money,o.salary*26);S.contract=2;o.used=true;if(S.ovr>=73)S.stage='LCK 주전 도전';else if(S.stage==='아카데미 유망주')S.stage='LCK CL 핵심 선수';addNews('⇄','이적 완료',`${team(S.team)[1]}으로 이적했습니다. 새로운 환경에서 도전을 이어갑니다.`);save();render('market');notify('이적이 완료되었습니다.')}function rejectOffer(){let o=S.offers.find(o=>!o.used);if(o)o.used=true;addNews('×','이적 제안 거절','현재 팀에서 커리어를 이어가기로 결정했습니다.');save();render('market');notify('제안을 거절했습니다.')}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`rift-career-${S.name||'save'}.json`;a.click();URL.revokeObjectURL(url);notify('세이브 파일을 내보냈습니다.')}function importSave(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.version!==1||!d.stats||!d.history)throw Error('bad');S=d;save();go(S.created?'home':'newcareer');notify('세이브를 불러왔습니다.')}catch(e){notify('올바른 RIFT CAREER 세이브 파일이 아닙니다.')}};r.readAsText(file)}function resetSave(){if(!confirm('현재 브라우저의 커리어 저장 데이터를 삭제할까요? 먼저 내보내기를 권장합니다.'))return;S=fresh();save();go('newcareer');notify('저장 데이터를 초기화했습니다.')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$$('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$$('.sidebar [data-page]').forEach(b=>{if(!b.closest('#nav'))b.addEventListener('click',()=>go(b.dataset.page))});$('#mobilemenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
window.R={go,pick,strategy,playMatch,train,advanceWeek,seekOffers,acceptOffer,rejectOffer,exportSave,importSave,resetSave,signContract};
if(S.created){calcOvr();render('home')}else render('newcareer');
})();
</script></body></html>
